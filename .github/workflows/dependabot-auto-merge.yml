name: Dependabot Auto-merge
on: pull_request_target

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  dependabot:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Create tracking issue for upgrade
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        id: create-issue
        run: |
          PR_TITLE=$(gh pr view "$PR_URL" --json title --jq .title)
          PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
          
          # Create tracking issue assigned to gabezurita
          ISSUE_URL=$(gh issue create \
            --title "chore(deps): track $PR_TITLE" \
            --body "Automated dependency update tracking for PR #$PR_NUMBER ($PR_URL)." \
            --assignee gabezurita 2>/dev/null || gh issue create \
            --title "chore(deps): track $PR_TITLE" \
            --body "Automated dependency update tracking for PR #$PR_NUMBER ($PR_URL).")
          
          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr review --approve --body "Auto-approved: passing test suite verification" "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge with Co-Author attribution
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          PR_TITLE=$(gh pr view "$PR_URL" --json title --jq .title)
          PR_BODY=$(gh pr view "$PR_URL" --json body --jq .body)
          ISSUE_URL="${{ steps.create-issue.outputs.issue_url }}"
          
          COAUTH="Co-authored-by: Gabriel Zurita <gabezurita@gmail.com>"
          MERGE_BODY="${PR_BODY}"$'\n\n'"${COAUTH}"
          if [ -n "$ISSUE_URL" ]; then
            MERGE_BODY="${MERGE_BODY}"$'\n\n'"Closes ${ISSUE_URL}"
          fi
          
          gh pr merge --auto --squash \
            --subject "$PR_TITLE" \
            --body "$MERGE_BODY" \
            "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Close tracking issue
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.create-issue.outputs.issue_url != '' }}
        run: |
          gh issue close "${{ steps.create-issue.outputs.issue_url }}" \
            --comment "Verified by CI and queued for squash merge via ${{ github.event.pull_request.html_url }}."
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}
